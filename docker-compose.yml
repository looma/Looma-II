
networks:
  loomanet:
    name: loomanet
    # Reuse the existing network created by the observability stack.
    # Prevents Docker Compose warnings and ensures cross-stack DNS works.
    external: true

volumes:
  looma_tmp:
    name: looma_tmp
  looma_content:
    name: looma_content
  looma_maps2018:
    name: looma_maps2018
  looma_epaath:
    name: looma_epaath
  looma_ai_data:
    name: looma_ai_data
  looma_search_index:
    name: looma_search_index
  looma_search_hf:
    name: looma_search_hf
  looma_apache_logs:
    name: looma_apache_logs
    external: true

services:
  looma-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: loomaweb:latest
    container_name: looma-web
    ports:
      - "48080:8080"
    volumes:
      - looma_content:/usr/local/var/www/content:ro
      - looma_maps2018:/usr/local/var/www/maps2018:ro
      - looma_epaath:/usr/local/var/www/ePaath:ro
      # Share Apache access/error logs with the OTel Collector for filelog ingestion.
      - looma_apache_logs:/var/log/apache2
    environment:
      LOOMA_SEARCH_ENGINE: semantic
      LOOMA_SEARCH_URL: http://looma-search:46333/search
      # Semantic search is always served by the dedicated search index service
      # (looma-search). Keeping this separate from looma-ai makes search stable
      # even if AI is down. NOTE: looma-search does NOT use the zvec library;
      # looma-ai is the one that does. See README-ZVEC.txt section 0.
      LOOMA_SEARCH_URL_SEMANTIC: http://looma-search:46333/search
      LOOMA_AI_URL: http://looma-ai:8089
      # OpenTelemetry — PHP shim posts spans to the otel-collector. We also
      # publish counters/logs from looma-telemetry.php and logPageHit().
      OTEL_SERVICE_NAME: looma-web
      OTEL_SERVICE_NAMESPACE: looma
      OTEL_EXPORTER_OTLP_ENDPOINT: http://looma-otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: "service.name=looma-web,service.namespace=looma,service.version=dev,deployment.environment=looma"
      LOOMA_ENV: "${LOOMA_ENV:-looma}"
      # Piper TTS runs inside this container (launch.sh -> piper_server.py, which
      # looma-TTS.php calls on 127.0.0.1:5002). Warm voices are what keep a Speak
      # press near a second; each warm (voice, speed) pair holds its model in RAM,
      # so 3 covers the everyday English + Nepali pair plus one speed change and
      # stays comfortable on an 8 GB box.
      LOOMA_PIPER_MAX_WORKERS: "3"
      LOOMA_PIPER_PREWARM: "1"
    depends_on:
      - looma-db
      - looma-search
      - looma-ai
    restart: unless-stopped
    tty: true
    networks:
      - loomanet

  # NOTE: there is no TTS service here. Piper (served locally inside looma-web
  # via looma-TTS.php) is the offline engine, and ResponsiveVoice is cloud-side
  # and client-only, so neither needs a container of its own.

  looma-ai:
    build:
      context: ./looma-ai
      dockerfile: Dockerfile
    image: looma-ai:latest
    container_name: looma-ai
    ports:
      - "8089:8089"
    environment:
      # OpenTelemetry: send traces to the observability stack's collector.
      OTEL_SERVICE_NAME: looma-ai
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://looma-otel-collector:4318
      OTEL_EXPORTER_OTLP_TIMEOUT: "10000"
      OTEL_PYTHON_LOG_CORRELATION: "false"
      PYTHONWARNINGS: "ignore:pkg_resources is deprecated as an API:UserWarning"
      OTEL_RESOURCE_ATTRIBUTES: service.name=looma-ai,service.namespace=looma,service.version=dev,deployment.environment=looma
      LOOMA_ENV: "${LOOMA_ENV:-looma}"
      LOOMA_SOURCE_ROOT: /looma/content
      LOOMA_DEVICE: cpu
      # Enable embeddings for curriculum zvec ingestion/search. If this host is
      # moved to an older CPU that cannot run torch, set these back to 1/0.
      LOOMA_DISABLE_EMBEDDINGS: "0"
      LOOMA_ENABLE_EMBED_INDEXING: "1"
      HF_HOME: /app/data/models/hf
      TRANSFORMERS_CACHE: /app/data/models/hf
      LOOMA_MONGO_URL: mongodb://looma-db:27017
      LOOMA_MONGO_DB: looma
      LOOMA_MONGO_COLLECTION: activities
      # OpenTelemetry — see scripts/otel_bootstrap.py
    volumes:
      # looma-ai writes generated chapter resources back into content (e.g. .summary/.keywords)
      - looma_content:/looma/content
      - looma_ai_data:/app/data
    command: ["python", "scripts/looma_server.py", "--host", "0.0.0.0", "--port", "8089"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    tty: true
    networks:
      - loomanet

  looma-db:
    build:
      context: ./mongo-dump
      dockerfile: Dockerfile
    image: loomadb:latest
    container_name: looma-db
    ports:
      - "47017:27017"
    restart: unless-stopped
    tty: true
    networks:
      - loomanet

  looma-search:
    build:
      context: ..
      dockerfile: Looma/search-service/Dockerfile
    image: loomasearch:latest
    container_name: looma-search
    ports:
      - "46333:46333"
    depends_on:
      - looma-db
    environment:
      MONGO_URL: mongodb://looma-db:27017
      MONGO_DB: looma
      MONGO_COLLECTION: activities
      # all-MiniLM-L6-v2 (384-dim, matches EMBEDDING_DIM) is ~5x faster on CPU than
      # all-mpnet-base-v2, so the first/background index build completes much sooner.
      # Must match the model baked into the image (search-service/Dockerfile).
      MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      HF_HOME: /models/hf
      # Renamed from /data/zvec-index: this service contains no zvec.
      # search_service.py falls back to the old directory if it still
      # holds the index, so an existing volume is never orphaned.
      INDEX_DIR: /data/search-index
      # Build the embedding index only when it's missing. Rebuilding the whole
      # search index on every restart is a heavy CPU+disk spike that saturated the
      # shared WSL2 virtual disk and tripped Coroot's "high I/O load" alerts.
      # The index lives on the persistent looma_search_index volume, so a normal
      # restart can reuse it; delete the volume (or set this to 1) to force a
      # rebuild after the source data changes.
      SEARCH_REBUILD_ON_START: "0"
      SEARCH_PORT: "46333"
      # search_service.py pins every BLAS/OMP pool to 1 thread by default. That
      # is the right call on the 8 GB board -- a multi-threaded embed there was
      # what saturated the shared disk and tripped Coroot's I/O alerts -- but it
      # is exactly wrong on the workstation that BUILDS the shipped index, where
      # a full-corpus embed is a one-off and the machine has cores to spare.
      # The service reads these with setdefault(), so setting them here wins.
      # Leave at 1 on a box; deploy/odroid/build-search-artifacts.sh raises it.
      OMP_NUM_THREADS: "${LOOMA_SEARCH_THREADS:-1}"
      OPENBLAS_NUM_THREADS: "${LOOMA_SEARCH_THREADS:-1}"
      MKL_NUM_THREADS: "${LOOMA_SEARCH_THREADS:-1}"
      NUMEXPR_NUM_THREADS: "${LOOMA_SEARCH_THREADS:-1}"
      # How deep into a document a semantic search can reach. The embedding
      # model only reads its first ~1000 characters, so a document is embedded
      # as up to this many overlapping windows — 4 covers roughly the first two
      # printed pages, which is what makes a textbook findable by its content
      # rather than only by its cover.
      #
      # This is the setting that drives the index's size and the service's
      # resident memory: only text-bearing documents (PDFs, HTML) grow, but they
      # grow with it. Keep the value used to BUILD a prebuilt index and the one
      # on the box in step — an index built at 4 loads fine at any value, but
      # its extra windows are only worth carrying if the box searches them.
      SEARCH_MAX_CHUNKS_PER_DOC: "${LOOMA_SEARCH_MAX_CHUNKS:-4}"
      # Results per query. The old default of 12 was chosen when nothing filtered
      # the hits; now that the Type/Source checkboxes are pushed down into the
      # index, the caller asks for more (see LOOMA_SEARCH_TOPK in
      # looma-database-utilities.php) and this is only the floor.
      SEARCH_TOPK: "${LOOMA_SEARCH_TOPK:-12}"
      OTEL_SERVICE_NAME: looma-search
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://looma-otel-collector:4318
      OTEL_EXPORTER_OTLP_TIMEOUT: "10000"
      OTEL_PYTHON_LOG_CORRELATION: "false"
      PYTHONWARNINGS: "ignore:pkg_resources is deprecated as an API:UserWarning"
      OTEL_RESOURCE_ATTRIBUTES: service.name=looma-search,service.namespace=looma,service.version=dev,deployment.environment=looma
      LOOMA_ENV: "${LOOMA_ENV:-looma}"
    volumes:
      - looma_search_index:/data
      - looma_search_hf:/models/hf
    restart: unless-stopped
    tty: true
    networks:
      - loomanet

  # Semantic search is served exclusively by the zvec index service
  # (looma-search). The Qdrant-backed legacy search service has been removed.
