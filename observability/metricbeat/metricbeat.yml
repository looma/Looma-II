metricbeat.modules:
  - module: docker
    metricsets:
      - container
      - cpu
      - diskio
      - event
      - healthcheck
      - info
      - image
      - memory
      - network
    hosts: ["unix:///var/run/docker.sock"]
    # The Docker socket is shared by five collectors (otel-collector,
    # coroot-node-agent, docker-stats-exporter, vector and this Metricbeat).
    # Under disk-I/O pressure the daemon's /containers/json enumeration over
    # ~20 containers can take longer than the previous 10s period, which made
    # every metricset fail with "context deadline exceeded". Polling at 30s
    # both cuts the socket/OpenSearch write load 3x and raises the effective
    # fetch deadline well clear of a slow daemon response.
    #
    # LOOMA_METRICBEAT_PERIOD overrides this — the odroid overlay
    # (docker-compose.odroid.yml) sets it to 1h: container/Mongo stats are
    # infrastructure health, not urgent, unlike the app's own page/chapter/
    # exercise/exam/score telemetry (looma-telemetry.php), which ships
    # in real time over a completely separate OTLP path regardless of this
    # setting. The server's own self-monitoring metricbeat is unaffected
    # (env unset there, so it keeps the 30s default below).
    period: ${LOOMA_METRICBEAT_PERIOD:30s}
    # Timeout stays independent of period — always give a single slow daemon
    # response room to complete rather than being cancelled mid-flight, even
    # when period itself is stretched out to 1h.
    timeout: 30s
    enabled: true

  # MongoDB — the Looma application database. Standalone instance, no auth in
  # this compose, so no credentials are needed.
  #  - status  : serverStatus (connections, opcounters, network, memory, asserts)
  #  - dbstats : per-database size/object/index counts
  #  - metrics : serverStatus.metrics (document ops, query executor, ttl, ...)
  # replstatus/collstats are intentionally omitted: looma-db is not a replica
  # set, and collstats would fan out one document per collection.
  #
  # LOOMA_METRICBEAT_MONGO_HOST default ("looma-db") only resolves on a
  # DOCKER-mode app deployment, where a container of that name shares this
  # bridge network (loomanet). It NEVER resolved on a native odroid install
  # (MongoDB there is host-installed, reachable only via
  # host.docker.internal — see docker-compose.odroid.yml's extra_hosts) or on
  # this central self-monitoring instance (no app MongoDB here at all,
  # LOOMA_METRICBEAT_MONGO_ENABLED=false in docker-compose.yml) — every
  # metricset silently failed with a DNS lookup error instead, which is why
  # the Grafana MongoDB dashboard was permanently empty on a native box.
  - module: mongodb
    metricsets:
      - status
      - dbstats
      - metrics
    hosts: ["${LOOMA_METRICBEAT_MONGO_HOST:looma-db}:27017"]
    period: ${LOOMA_METRICBEAT_PERIOD:30s}
    enabled: ${LOOMA_METRICBEAT_MONGO_ENABLED:true}

processors:
  - add_host_metadata: ~
  - add_docker_metadata: ~

setup.ilm.enabled: false

output.logstash:
  hosts: ["looma-vector:5044"]

logging.to_stderr: true
logging.level: info
