# Observability — Odroid overlay (8 GB ARM device)
#
# Use TOGETHER with the canonical compose, never alone:
#
#   docker compose -f docker-compose.yml -f docker-compose.odroid.yml \
#     up -d --no-deps vector metricbeat
#
# An odroid box NEVER runs OpenSearch/Grafana/otel-collector/etc. — those only
# ever run on the dedicated data server (see observability/DATA-SERVER.md).
# This box runs ONLY the observability AGENTS: Vector (in its "agent" role,
# LOOMA_VECTOR_CONFIG=vector-agent.toml — ships everything to the server's
# Vector over its native wire protocol, never touches OpenSearch directly)
# and Metricbeat (ships the modules below to this box's own Vector over Beats).
# looma-installer.sh's settle_observability() decides whether this
# overlay is even used at all — on by default the moment the server is
# reachable, off otherwise (--no-observability forces it off; --remote-obs
# picks a different server).

services:
  vector:
    mem_limit: 256m
    # looma-web is native here (Apache + PHP, not a container), so its logs
    # never reach sources.docker_logs — vector-agent.toml's apache_web_logs
    # file source tails the real files directly instead. Read-only: Vector
    # only ever reads these, never rotates/deletes them.
    volumes:
      - /var/log/apache2:/var/log/apache2:ro
    environment:
      # The agent role — see the big comment at the top of vector-agent.toml.
      # Overridden back to vector.toml only if this box is ever pointed at
      # itself for local debugging; looma-installer.sh always sets this.
      LOOMA_VECTOR_CONFIG: ${LOOMA_VECTOR_CONFIG:-/etc/vector/vector-agent.toml}
      # Where the server's Vector is (its native wire protocol, :6000) —
      # looma-installer.sh's --remote-obs / settle_observability() sets this.
      LOOMA_VECTOR_SERVER: ${LOOMA_VECTOR_SERVER:-looma-vector:6000}
      # Which box shipped each log/metric, and its LAN IP — every odroid ships
      # to the one server, so Vector stamps box_name/box_ip on everything.
      # looma-installer.sh 'up' exports both (name from /etc/looma-odroid.env
      # or the hostname; IP resolved fresh each boot).
      LOOMA_BOX_NAME: ${LOOMA_BOX_NAME:-}
      LOOMA_BOX_IP: ${LOOMA_BOX_IP:-}
      # This box's public IP, captured once at install time (empty if it had
      # no internet then) — box_ip above is LAN-private and has no real-world
      # location, so the data server's geoip ingest pipeline resolves this one
      # instead. See /etc/looma-odroid.env.
      LOOMA_BOX_PUBLIC_IP: ${LOOMA_BOX_PUBLIC_IP:-}
      # Rough city/country from that same install-time lookup — lets Grafana
      # filter machines/scores by location, not just by device name.
      LOOMA_BOX_GEO_CITY: ${LOOMA_BOX_GEO_CITY:-}
      LOOMA_BOX_GEO_COUNTRY: ${LOOMA_BOX_GEO_COUNTRY:-}

  metricbeat:
    mem_limit: 384m
    environment:
      # Which Metricbeat modules a box ships:
      #   Docker deployment: docker + system + mongodb
      #   native deployment: system + mongodb
      # looma-installer.sh sets the two variables below for a native install: the
      # app does not run in containers there, and MongoDB is on the host, reached
      # through this network's gateway ("auto", see docker-entrypoint-wrapper.sh).
      LOOMA_METRICBEAT_DOCKER_ENABLED: ${LOOMA_METRICBEAT_DOCKER_ENABLED:-true}
      LOOMA_METRICBEAT_MONGO_HOST: ${LOOMA_METRICBEAT_MONGO_HOST:-looma-db}
      LOOMA_METRICBEAT_MONGO_ENABLED: "true"
      LOOMA_METRICBEAT_PERIOD: ${LOOMA_METRICBEAT_PERIOD:-30s}
      LOOMA_METRICBEAT_DISK_ENABLED: "true"
    volumes:
      # The host's root filesystem, for disk use (see metricbeat.yml). Not
      # recursive: a recursive bind would hold /snap, USB disks and every other
      # submount busy for as long as this container runs.
      - type: bind
        source: /
        target: /hostfs
        read_only: true
        bind:
          recursive: disabled

# The canonical observability compose declares `loomanet` as a compose-managed
# network. On the box the network is created up-front (by the installer/looma-up.sh)
# and shared with the app stack, so treat it as EXTERNAL here — otherwise compose
# errors with "network loomanet exists but was not created by compose". This
# overlay is only used on the box (where loomanet is always pre-created), so dev
# (which uses the canonical compose to create it) is unaffected.
networks:
  loomanet:
    name: loomanet
    external: true
